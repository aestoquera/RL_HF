[project]
name = "rl-hf"
version = "0.1.0"
description = "Reinforcement Learning with Hugging Face"
readme = "README.md"
authors = [
    { name = "Adrian_E", email = "aestoquera@ikerlan.es" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "stable-baselines3",
    "swig",
    "gymnasium[box2d]",
    "huggingface-sb3",
    "ipykernel>=7.3.0",
    "moviepy>=2.2.1",
]

[project.scripts]
rl-hf = "rl_hf:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
