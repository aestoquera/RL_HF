[project]
name = "rl-hf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aestoquera", email = "aestoquera@ikerlan.es" }
]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.3.0",
    "imageio>=2.37.4",
    "ipykernel>=7.3.0",
